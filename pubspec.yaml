name: app_help_center
description: A lightweight Flutter help center and user communication kit for app announcements, changelog, FAQ, support, and rating links.
version: 0.2.7
homepage: https://github.com/kyinwind/app_help_center
repository: https://github.com/kyinwind/app_help_center
issue_tracker: https://github.com/kyinwind/app_help_center/issues
topics:
  - help-center
  - announcements
  - changelog
  - faq
  - support

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  # Only stable Client/Multipart APIs are used. Keep compatibility with
  # Flutter SDKs and platform forks that still resolve http 0.13.x.
  http: ">=0.13.5 <2.0.0"
  # MediaType.parse is available since well before 4.0.2. Using 4.0.2 as the
  # lower bound also remains compatible with Flutter 3.22's collection 1.18.0.
  http_parser: ">=4.0.2 <5.0.0"
  image_picker: ^1.0.0
  intl: ">=0.19.0 <0.21.0"
  shared_preferences: ">=2.2.0 <3.0.0"
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
